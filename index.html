<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Sejarah UAS 25-26</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #ffffff;
            --primary: #16a085;
            --correct: #2ecc71;
            --wrong: #e74c3c;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #quiz-box {
            background: var(--card);
            width: 90%;
            max-width: 750px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { color: var(--primary); margin-bottom: 20px; }
        input[type="text"] {
            padding: 15px; width: 80%; margin-bottom: 20px;
            border: 2px solid #ddd; border-radius: 10px; font-size: 16px;
        }
        #timer {
            font-size: 28px; font-weight: bold; color: #f39c12;
            background: #fff3e0; display: inline-block;
            padding: 5px 25px; border-radius: 50px; margin-bottom: 15px;
        }
        .q-text { font-size: 20px; font-weight: bold; margin-bottom: 25px; color: var(--text); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn {
            padding: 15px; border-radius: 12px; border: none;
            cursor: pointer; font-size: 16px; font-weight: 500;
            background: #f0f2f5; transition: 0.2s;
        }
        .btn:hover:not([disabled]) { background: #e4e6e9; transform: translateY(-2px); }
        .btn-start { background: var(--primary); color: white; padding: 15px 40px; }
        .correct { background-color: var(--correct) !important; color: white !important; }
        .wrong { background-color: var(--wrong) !important; color: white !important; }
        .hidden { display: none; }
        #review-container { 
            text-align: left; margin-top: 25px; 
            max-height: 400px; overflow-y: auto; 
            padding: 15px; border-top: 2px solid #eee; 
        }
        .review-card { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .ans-label { font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div id="quiz-box">
    <div id="start-screen">
        <h1>UAS SEJARAH 25-26</h1>
        <p>Masukkan Nama Lengkap Anda:</p>
        <input type="text" id="name-input" placeholder="Nama Anda..." autocomplete="off">
        <br>
        <button class="btn btn-start" onclick="mulaiKuis()">Mulai Kuis</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="timer">30</div>
        <div id="soal-ke" style="color: #888; margin-bottom: 10px;"></div>
        <div class="q-text" id="display-soal"></div>
        <div class="options-grid" id="display-opsi"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Hasil Evaluasi</h2>
        <h3 id="display-skor"></h3>
        <button class="btn" style="background:#3498db; color:white" onclick="location.reload()">Ulangi Kuis</button>
        <div id="review-container"></div>
    </div>
</div>

<script>
    // DATA SEMUA SOAL
    const databaseSoal = [
        {q: "Pengertian Sejarah secara umum adalah seluruh peristiwa….", a: ["Masa lampau", "Akan datang", "Aktual", "Akhir"], c: "Masa lampau"},
        {q: "Sejarah berasaL dari bahasa arab dari kata……", a: ["Syahzaratun", "Karikatun", "Alzaabar", "Turiturian"], c: "Syahzaratun"},
        {q: "Menurut Kuntowijoyo Tujuan Rekonstruksi masa lampau adalah untuk kepentingan ….", a: ["Masa yang akan datang", "Masa lalu", "Pribadi", "Sesaat"], c: "Masa yang akan datang"},
        {q: "Ahli sejarah yang dikenal sebagai bapak Sejarah adalah", a: ["Herodotus", "Edaward Hallet Carr", "Kuntowijoyo", "Muhammad yamin"], c: "Herodotus"},
        {q: "Ahli sejarah yang berpendapat bahwa sejarah bercerita tentang penyebab manusia melakukan berbagai tindakan adalah…..", a: ["Herodotus", "Hallet Carr", "Kuntowijoyo", "M. Yamin"], c: "Herodotus"},
        {q: "Mengetahui peristiwa masa lampau agar dapat memperbaiki dirI saat ini demi masa depan yang lebih baik merupakan..", a: ["Manfaat Sejarah", "Pegertian Sejarah", "Sumber Sejarah", "Tujuan Sejarah"], c: "Manfaat Sejarah"},
        {q: "Sejarah dapat memberikan Ilham atau Inspirasi kepada Generasi muda, merupakan manfaat .......Sejarah", a: ["inspiratif", "Edukatif", "Rekreatif", "Instruktif"], c: "inspiratif"},
        {q: "Berikut adalah manfaat Sejarah menurut Louis Gotschalk kecuali.....", a: ["Prinsipil", "Edukatif", "Instruktif", "Rekreatif"], c: "Prinsipil"},
        {q: "Cerita langsung dari pelaku sejarah disebut sebagai sumber...", a: ["lisan", "Tulisan", "Benda", "Utama"], c: "lisan"},
        {q: "Kritik mengenai keaslian benda Sejarah disebut kritik......", a: ["Ekstern", "Intern", "Modern", "Kreatif"], c: "Ekstern"},
        {q: "Bentuk Fisik manusia Purba yang mirip dengan bentuk Fisik manusia modern adalah manusia purba yang hidup pada zaman....", a: ["Aluvium", "Diluvium", "Pleistosen", "Mesozoikum"], c: "Aluvium"},
        {q: "Berakhirnya Zaman Pra Aksara suatu bangsa ditandai dengan Ditemukannya ……", a: ["Tulisan", "Artefak", "Kepercayaan", "Fosil"], c: "Tulisan"},
        {q: "Zaman hidupnya Dinosaurus disebut zaman...", a: ["Mesoszoikum", "Palaeozoikum", "Neozoikum", "Arkaeozoikum"], c: "Mesoszoikum"},
        {q: "Tulisan pertama di Indonesia adalah tulisan berhuruf...", a: ["Pallawa", "Hieroglip", "Kawi", "Latin"], c: "Pallawa"},
        {q: "Zaman Arkaeozoikum adalah zaman....", a: ["Terbentuknya bumi belum ada kehidupan", "Mulai adanya kehidupan", "Punahnya Dinosaurus", "Hidupnya Manusia Purba"], c: "Terbentuknya bumi belum ada kehidupan"},
        {q: "Manusia raksasa yang ditemukan oleh Vons Koenigswald diberi nama....", a: ["Meganthropus Palaeojavanicus", "Homo Soloensis", "Pitecnthropus Erectus", "Homo Wajakensis"], c: "Meganthropus Palaeojavanicus"},
        {q: "Fosil manusia Purba tertua di Indonesia adalah ........", a: ["Meganthropus", "Pitecanthropus", "Homo Soloensis", "Homo Floresiensis"], c: "Meganthropus"},
        {q: "Fosil Manuisa Purba yang pertama ditemukan di Indonesia adalah....", a: ["Pitecanthropus Erectus", "Meganthropus", "Homo Floresiensis", "Homo Soloensis"], c: "Pitecanthropus Erectus"},
        {q: "Manusia Kera yang berjalan Tegak disebut...", a: ["Pitecanthropus Erectus", "Meganthropus", "Homo Floresiensis", "Homo Soloensis"], c: "Pitecanthropus Erectus"},
        {q: "Meganthropus Palaeojavanicus ditemukan oleh..", a: ["Vons Koenigswald", "Eguene du bois", "Van Hoven", "Van Mouried"], c: "Vons Koenigswald"},
        {q: "ISI Politik Etis yang berhubungan dengan berdirinya HIS adalah...", a: ["Edukasi", "Irigasi", "Transmigrasi", "Urbanisasi"], c: "Edukasi"},
        {q: "Tokoh yang mengusulkan pelaksanaan Politik Etis adalah...", a: ["Van De Venter", "Van Mook", "Van Royjen", "Van Dem"], c: "Van De Venter"},
        {q: "Kebijkan Kolonial Belanda yang berhubungan dengan lahirnya golongan terpelajar di Indonesia adalah...", a: ["Trias Van Deventer", "Tanam Paksa", "Rody", "Romusa"], c: "Trias Van Deventer"},
        {q: "Sekolah setarap SD bagi oarang belanda dan eropa lainnya di Indonesia pada masa kolonial....", a: ["ELS", "HIS", "AMS", "STOVIA"], c: "ELS"},
        {q: "Sekolah pemerintah kolonial Belanda setingkat SMP adalah...", a: ["MULO", "HIS", "ELS", "AMS"], c: "MULO"},
        {q: "Lahirnya Nasionalisme Indonesia dipelopori oleh golongan....", a: ["Terpelajar", "Ulama", "Ningrat", "Kiyai"], c: "Terpelajar"},
        {q: "Lahirnya Pergerakan Nasional ditandai dengan berdirinya Organisasi..", a: ["Budi Utomo", "PNI", "NU", "Indische Partij"], c: "Budi Utomo"},
        {q: "Pergerakan Nasinalisme di India dipimpin oleh...", a: ["Mahadma Gandhi", "Drs Sun Yat Sen", "Jose Rizal", "Jawaharlal Nehru"], c: "Mahadma Gandhi"},
        {q: "Kebijakan pemerintah Kolonial yang mendorong lahirnya golongan terpalajar adalah...", a: ["Politik Etis", "Politik Isolasi", "Tanam Paksa", "Politik Pintu Terbuka"], c: "Politik Etis"},
        {q: "Golongan masyarakat Indonesia yang pertama sekali menyadari akan nasib buruk bangsanya akibat penjajahan adalah golongan...", a: ["Terpelajar", "Kiyai", "Tuan Tanah", "Ningrat"], c: "Terpelajar"},
        {q: "Surat kabar yang diterbitkan organisasi Indische Partij adalah...", a: ["De Express", "Perjta Barat", "Sinar Hindia", "Darmo Kondo"], c: "De Express"},
        {q: "Pers ( surat Kabar ) yang dikenal sebagai pembuka mata atau pelopor kesadaran berbangsa di Indonesia adalah....", a: ["Bintang Hindia", "Pertja Barat", "De Expres", "Pewarta Prijaji"], c: "Bintang Hindia"},
        {q: "Oganisasi Pergerakan Pertama di Indonesia adalah....", a: ["Budi Utomo", "PNI", "SI", "Indische Partij"], c: "Budi Utomo"},
        {q: "Tanggal berdirinya Budi Utomo 20 Mei diperingati sebagai hari...", a: ["Kebangkitan Nasional", "Pahlawan", "Pendidikan Nasional", "Kesaktian Pancasila"], c: "Kebangkitan Nasional"},
        {q: "Tiga Tujuan Mulia dari Trikor dharmo sebagai berikut kecuali....", a: ["Pasti", "Bakti", "Sakti", "Budi"], c: "Pasti"},
        {q: "Sebab Trikoro Dharmo diubah menjadi Jong Java adalah....", a: ["Bersifat Jawa Sentris", "Didominasi Pelajar", "Didominasi Kiyai", "Didominasi Golongan Tua"], c: "Bersifat Jawa Sentris"},
        {q: "Serikat Islam disusupi paham komunis yang dibawa oleh...", a: ["Snevilet dan Bergman", "Untung dan Tan Malaka", "Aidit dan Muso", "Semaun dan Darsono"], c: "Semaun dan Darsono"},
        {q: "Organisasi yang bertujuan modernisasi dan pemurnian Islam dari unsur unsur non Islam adalah...", a: ["Muhammadiyah", "Serikat Islam", "Nahdatul Ulama", "Serikat Dagang Islam"], c: "Muhammadiyah"},
        {q: "Organisai politik yang pertama di Indonesia adalah...", a: ["Indische Partij", "PNI", "Budi Utomo", "PKI"], c: "Indische Partij"},
        {q: "Tulisan kritik Kihajar Dewantara terhadap perayaan kemerdekaan Belanda berjudul “Als ik een Nederlander was” artinya.....", a: ["Andaikan aku orang Belanda", "Indonesia Menggugat", "Andaikan aku orang Indonesia", "Indonesia berparlemen"], c: "Andaikan aku orang Belanda"},
        {q: "Kemerdekaan Indonesia dipersIapkan melalui sidang…", a: ["BPUPKI", "MPRS", "MPR", "DPR"], c: "BPUPKI"},
        {q: "Perdana Menteri Jepang yang memberikan janji kemerdekaan kepada Indonesia", a: ["Koiso", "Tojo", "Imamura", "Nisihimura"], c: "Koiso"},
        {q: "Untuk merealisasikan janji kermerdekaan kepada Indonesia Jepang membentuk", a: ["BPUPKI", "PPKI", "PETA", "HEIHO"], c: "BPUPKI"},
        {q: "Tokoh yang mengusulkan dasar negara Pancasila adalah…", a: ["Ir Soekarno", "Muhammad Yamin", "Soepomo", "Radjiman Widyodiningrat"], c: "Ir Soekarno"},
        {q: "Panitia Kecil yang dibentuk BPUPKI berhasil membentuk…", a: ["Piagam Jakarta", "Pemerintahan RI", "Dasar Negara", "UUD 1945"], c: "Piagam Jakarta"},
        {q: "Karena perbedaan pendapat antara golongan Tua dengan golongan Muda mengenai Proklamasi, Ir Soekarno dan Moh Hatta di culik (diamankan) ke ......", a: ["Rengas Dengklok", "Menteng", "Bandung", "Surabaya"], c: "Rengas Dengklok"},
        {q: "Tokoh yang bertugas mengetik Teks Proklamasi adalah...", a: ["Sajoeti Malik", "Ir Soekarno", "Ahmad Soebarjo", "Sukarni"], c: "Sajoeti Malik"},
        {q: "Alasan Golongan Tua berpendapat Proklamasi dilakasanakan setelah sidang PPKI adalah...", a: ["Untuk menghindari pertumpahan darah", "Supaya Proklamasi Sah", "Supaya Proklamasi di akui Jepang", "Supaya Proklamasi diakui dunia"], c: "Untuk menghindari pertumpahan darah"},
        {q: "Isi Teks Proklamasi bagian kedua merupakan buah pikiran dari....", a: ["Moh Hatta", "Sukarani", "Ahmad Sobarjo", "Ir Soekarno"], c: "Moh Hatta"},
        {q: "Akibat menyerahnya Jepang kepada Sekutu Indonesia mengalami...", a: ["Vacuum Of Power", "Pemberontakan", "Malaise", "Peristiwa Rengas Dengklok"], c: "Vacuum Of Power"},
        {q: "Sultan Jogjakarta yang mengakui dan tunduk kepada pemerintah Republik Indonesia adalah Sri Sultan hamengkubuwono ke....", a: ["IX", "XI", "VIII", "X"], c: "IX"},
        {q: "Persiden dan Wakil Presiden RI yang pertama dipilih dan diangkat melalui ...", a: ["Sidang PPKI", "Sidang MPR", "Sidang BPUPKI", "Sidang DPR"], c: "Sidang PPKI"},
        {q: "Tewasnya jenderal A.W.S Mallaby penyebab terjadinya pertempuran....", a: ["Surabaya", "Medan Area", "Bandung lautan Api", "Ambarawa"], c: "Surabaya"},
        {q: "Dokter yang tewas sewkatu memeriksa Cadangan Air Minum candi adalah ...", a: ["Karyadi", "Ismadi", "Slamet", "Sutomo"], c: "Karyadi"},
        {q: "Sekutu tiba di surabaya dengan di boncengi oleh....", a: ["NICA", "Gurka", "KNIL", "Marsose"], c: "NICA"},
        {q: "Pembunuhan massal 40.000 rakyat Sulawesi dilakukan oleh...", a: ["Raymond Westerling", "A.W.S Mallaby", "Ted Kelly", "Philip Christison"], c: "Raymond Westerling"},
        {q: "Berita proklamasi kemerdekaan Indonesia disebar luaskan melalui …. Kecuali.", a: ["Televisi", "Pamflet", "Berita dari mulut ke mulut", "Radio"], c: "Televisi"},
        {q: "Penolakan pembentukan negara Indonesia Timur adalah sebab terjadinya perang.,.", a: ["Puputan di Bali", "Palagan Ambarawa", "5 hari di Semarang", "Medan Area"], c: "Puputan di Bali"},
        {q: "Perjuangann mempertahankan kemerdekaan melalui perundingan adalah…", a: ["Diplomasi", "Bersenjata", "Puputan", "Gerilya"], c: "Diplomasi"},
        {q: "Gabungan negara negara Boneka bentukan Belanda di Indonesia adalah..", a: ["BFO", "NEFO", "OLNEFO", "UNCLOS"], c: "BFO"}
    ];

    let soalAcak = [];
    let idxSekarang = 0;
    let skor = 0;
    let waktu = 30;
    let pemutusWaktu;
    let jawabanUser = [];

    // Fungsi bantu mengacak array
    function acakArray(arr) {
        return arr.sort(() => Math.random() - 0.5);
    }

    function mulaiKuis() {
        const nama = document.getElementById('name-input').value;
        if (!nama) { alert("Tolong isi nama dulu ya!"); return; }
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        // Acak urutan soal dan acak pilihan jawaban di dalamnya
        soalAcak = acakArray([...databaseSoal]).map(item => {
            return { ...item, a: acakArray([...item.a]) };
        });

        tampilkanSoal();
    }

    function tampilkanSoal() {
        clearInterval(pemutusWaktu);
        waktu = 30;
        document.getElementById('timer').innerText = waktu;

        const data = soalAcak[idxSekarang];
        document.getElementById('soal-ke').innerText = `Soal ${idxSekarang + 1} dari ${soalAcak.length}`;
        document.getElementById('display-soal').innerText = data.q;

        const areaOpsi = document.getElementById('display-opsi');
        areaOpsi.innerHTML = "";

        data.a.forEach(teksOpsi => {
            const tombol = document.createElement('button');
            tombol.className = "btn";
            tombol.innerText = teksOpsi;
            tombol.onclick = () => cekJawaban(tombol, teksOpsi);
            areaOpsi.appendChild(tombol);
        });

        pemutusWaktu = setInterval(() => {
            waktu--;
            document.getElementById('timer').innerText = waktu;
            if (waktu <= 0) {
                clearInterval(pemutusWaktu);
                jawabanUser.push("Waktu Habis");
                tunjukkanYangBenar();
            }
        }, 1000);
    }

    function cekJawaban(tombolKlik, pilihan) {
        clearInterval(pemutusWaktu);
        const benar = soalAcak[idxSekarang].c;
        jawabanUser.push(pilihan);

        const semuaTombol = document.querySelectorAll('#display-opsi .btn');
        semuaTombol.forEach(b => b.disabled = true);

        if (pilihan === benar) {
            tombolKlik.classList.add('correct');
            skor++;
        } else {
            tombolKlik.classList.add('wrong');
            semuaTombol.forEach(b => {
                if (b.innerText === benar) b.classList.add('correct');
            });
        }
        setTimeout(lanjutKeSoalBerikutnya, 1500);
    }

    function tunjukkanYangBenar() {
        const benar = soalAcak[idxSekarang].c;
        const semuaTombol = document.querySelectorAll('#display-opsi .btn');
        semuaTombol.forEach(b => {
            b.disabled = true;
            if (b.innerText === benar) b.classList.add('correct');
        });
        setTimeout(lanjutKeSoalBerikutnya, 1500);
    }

    function lanjutKeSoalBerikutnya() {
        idxSekarang++;
        if (idxSekarang < soalAcak.length) {
            tampilkanSoal();
        } else {
            selesaiKuis();
        }
    }

    function selesaiKuis() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        const hasilPersen = Math.round((skor / soalAcak.length) * 100);
        document.getElementById('display-skor').innerText = `Skor: ${hasilPersen} / 100 (Benar ${skor} dari ${soalAcak.length})`;

        const containerReview = document.getElementById('review-container');
        containerReview.innerHTML = "<h4>Review Jawaban:</h4>";

        soalAcak.forEach((item, i) => {
            const pilihanKita = jawabanUser[i];
            const cekBenar = (pilihanKita === item.c);

            containerReview.innerHTML += `
                <div class="review-card">
                    <p><b>${i+1}. ${item.q}</b></p>
                    <p class="ans-label" style="color: ${cekBenar ? 'green' : 'red'}">
                        Pilihan Anda: ${pilihanKita} ${cekBenar ? '✓' : '✗'}
                    </p>
                    ${!cekBenar ? `<p class="ans-label" style="color: green">Jawaban Benar: ${item.c}</p>` : ''}
                </div>
            `;
        });
    }
</script>

</body>
</html>
